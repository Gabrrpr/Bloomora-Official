# Alembic config
[alembic]
script_location = alembic
sqlalchemy.url = ${DATABASE_URL}
prepend_sys_path = .
version_locations = alembic/versions

[post_write_hooks]
hooks = hgp,close

[hgp]
entry = hg
always_run = true
dependencies = 

[close]
entry = alembic.hooks.close.close

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
